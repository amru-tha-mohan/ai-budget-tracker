<!DOCTYPE html>
<html>
<head>
  <title>Budget Result</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Budget Summary</h1>

<p><b>Monthly Salary:</b> ₹{{ salary }}</p>
<p><b>Total Expenses:</b> ₹{{ total_expense }}</p>
<p><b>Savings:</b> ₹{{ savings }}</p>

<h2>Expense Breakdown</h2>
<div class="chart-row">
   <div class="chart-box"><canvas id="expenseChart"></canvas></div>
   <div class="chart-box"><canvas id="barChart"></canvas></div>
</div>

<h2>{{ advice }}</h2>

<h2>Monthly Expense Comparison</h2>
<canvas id="barChart"></canvas>

<a href="/dashboard">⬅ Back to Dashboard</a>
<br><br>
<button onclick="window.print()">📄 Download Report</button>
<script>
var ctx = document.getElementById('expenseChart').getContext('2d');
new Chart(ctx, {
    type: 'pie',
    data: {
        labels: ['Food','Rent','Travel'],
        datasets: [{
            data: [{{ food }}, {{ rent }}, {{ travel }}],
            backgroundColor: ['#ff6384','#36a2eb','#ffce56']
        }]
    },

  options: {
    responsive: true,
    maintainAspectRatio: false
  }

});
</script>

<script>
var ctx2 = document.getElementById('barChart').getContext('2d');
new Chart(ctx2, {
    type: 'bar',
    data: {
        labels: ['Food','Rent','Travel'],
        datasets: [{
            label: 'Expenses',
            data: [{{ food }}, {{ rent }}, {{ travel }}],
            backgroundColor: ['#ff6384','#36a2eb','#ffce56']
        }]
    },
  options: {
    responsive: true,
    maintainAspectRatio: false
  }
});
</script>

</body>
</html>
